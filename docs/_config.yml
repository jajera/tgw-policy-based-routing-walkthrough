title: TGW Policy-Based Routing
description: >-
  Walkthrough for jajera/tgw-policy-based-routing — destination-only Transit Gateway
  routing versus Policy-Based Routing with a runnable three-account demo.
theme: just-the-docs

url: https://tgw-policy-based-routing-walkthrough.johna.kiwi
baseurl: ""
permalink: pretty

# Shared johna.kiwi measurement ID (guides walkthrough smoke checks this).
ga_tracking: G-6GP64SX615

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  LAB: https://github.com/jajera/tgw-policy-based-routing
  DOCS: https://github.com/jajera/tgw-policy-based-routing-walkthrough
aux_links_new_tab: true

color_scheme: pbr
favicon_ico: "/assets/images/favicon.ico"

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png

twitter:
  card: summary_large_image

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

callouts_level: loud
callouts:
  finding:
    title: Finding
    color: green
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: purple
  warning:
    title: Warning
    color: yellow
  blocked:
    title: Not possible today
    color: red
  cost:
    title: Cost
    color: red

footer_content: >-
  Walkthrough for
  <a href="https://github.com/jajera/tgw-policy-based-routing">jajera/tgw-policy-based-routing</a>.
  AWS feature availability, limits, and behaviour can change — verify against current AWS
  documentation before relying on any claim here.

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  - walkthrough-brief.md
  - docker-compose.yml
  - scripts/
  - diagrams/
