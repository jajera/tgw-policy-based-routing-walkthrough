<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" role="img" aria-label="Path selection: TCP/443 via Hub vs Direct">
  <title>Path selection: TCP/443 via Hub vs Direct</title>
  <desc>Spoke A policy table steers destination TCP/443 via Hub and sends TCP/80 and ICMP Direct to Spoke B.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="diagram-arrow-head"/>
    </marker>
  </defs>
  <rect x="20" y="112.0" width="140" height="64" rx="10" class="diagram-node"/>
  <text x="90.0" y="136.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Spoke A</text>
  <text x="90.0" y="151.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">10.0.1.0/24</text>
  <rect x="200" y="40" width="360" height="240" rx="12" class="diagram-cluster"/>
  <text x="214" y="62" class="diagram-label" font-weight="600" font-size="12">Transit Gateway</text>
  <rect x="220" y="116.0" width="130" height="56" rx="10" class="diagram-accent"/>
  <text x="285.0" y="144.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Policy table</text>
  <rect x="390" y="72" width="140" height="56" rx="10" class="diagram-node"/>
  <text x="460.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Steer RT</text>
  <rect x="390" y="160" width="140" height="56" rx="10" class="diagram-node"/>
  <text x="460.0" y="188.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Direct RT</text>
  <rect x="620" y="68" width="140" height="64" rx="10" class="diagram-accent"/>
  <text x="690.0" y="92.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Hub</text>
  <text x="690.0" y="107.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">hairpin / NAT</text>
  <rect x="620" y="156" width="140" height="64" rx="10" class="diagram-node"/>
  <text x="690.0" y="180.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Spoke B</text>
  <text x="690.0" y="195.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">10.0.2.0/24</text>
  <line x1="160" y1="144.0" x2="220" y2="144.0" class="diagram-line" marker-end="url(#arrow)"/>
  <polyline points="350,144 370,144 370,100 390,100" fill="none" class="diagram-line" marker-end="url(#arrow)"/>
  <polyline points="370,144 370,188 390,188" fill="none" class="diagram-line" marker-end="url(#arrow)"/>
  <line x1="530" y1="100" x2="620" y2="100" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="539.0" y="89.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="575.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">TCP/443</text>
  <line x1="530" y1="188" x2="620" y2="188" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="539.0" y="177.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="575.0" y="188.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">:80 / ICMP</text>
  <polyline points="760,100 780,100 780,188 760,188" fill="none" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="220" y="248" width="320" height="22" rx="4" class="diagram-edge-bg"/>
  <text x="380" y="259" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">Same Spoke B IP — path diverges by destination port</text>
</svg>
