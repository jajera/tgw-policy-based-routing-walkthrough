<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="100%" role="img" aria-label="Lab topology: three-account hub-and-spoke with PBR">
  <title>Lab topology: three-account hub-and-spoke with PBR</title>
  <desc>Spoke A policy table selects Steer (TCP/443 via Hub) or Direct (:80 / ICMP to Spoke B). Hub owns IGW/NAT.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="diagram-arrow-head"/>
    </marker>
  </defs>
  <rect x="20" y="56" width="156" height="68" rx="10" class="diagram-node"/>
  <text x="98.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Spoke A</text>
  <text x="98.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">sandbox</text>
  <text x="98.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">10.0.1.0/24</text>
  <rect x="20" y="250" width="156" height="68" rx="10" class="diagram-node"/>
  <text x="98.0" y="269.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Spoke B</text>
  <text x="98.0" y="284.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">shared-svc</text>
  <text x="98.0" y="299.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">10.0.2.0/24</text>
  <rect x="730" y="56" width="150" height="232" rx="10" class="diagram-accent"/>
  <text x="805.0" y="149.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Hub</text>
  <text x="805.0" y="164.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">network</text>
  <text x="805.0" y="179.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">10.0.0.0/24</text>
  <text x="805.0" y="194.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">IGW + NAT</text>
  <rect x="210" y="24" width="490" height="310" rx="12" class="diagram-cluster"/>
  <text x="224" y="46" class="diagram-label" font-weight="600" font-size="12">Transit Gateway</text>
  <rect x="234" y="64" width="140" height="64" rx="10" class="diagram-accent"/>
  <text x="304.0" y="88.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Policy table</text>
  <text x="304.0" y="103.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">Spoke A only</text>
  <rect x="430" y="64" width="140" height="56" rx="10" class="diagram-node"/>
  <text x="500.0" y="84.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Steer RT</text>
  <text x="500.0" y="99.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">via Hub</text>
  <rect x="430" y="148" width="140" height="56" rx="10" class="diagram-node"/>
  <text x="500.0" y="168.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Direct RT</text>
  <text x="500.0" y="183.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">catch-all</text>
  <rect x="430" y="232" width="140" height="56" rx="10" class="diagram-node"/>
  <text x="500.0" y="260.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Hub RT</text>
  <rect x="234" y="308" width="430" height="16" rx="4" class="diagram-edge-bg"/>
  <text x="449" y="316" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">Rule 100 → Steer (TCP/443) · Rule 200 → Direct (*)</text>
  <line x1="176" y1="90" x2="234" y2="90" class="diagram-line" marker-end="url(#arrow)"/>
  <line x1="374" y1="96" x2="430" y2="96" class="diagram-line" marker-end="url(#arrow)"/>
  <polyline points="374,96 400,96 400,176 430,176" fill="none" class="diagram-line" marker-end="url(#arrow)"/>
  <line x1="570" y1="92" x2="730" y2="92" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="614.0" y="81.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="650.0" y="92.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">TCP/443</text>
  <line x1="570" y1="260" x2="730" y2="260" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="614.0" y="249.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="650.0" y="260.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">assoc.</text>
  <polyline points="430,176 400,176 400,284 176,284" fill="none" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="264.0" y="273" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="300" y="284" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">:80 / ICMP</text>
</svg>
