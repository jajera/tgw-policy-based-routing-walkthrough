<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" role="img" aria-label="Troubleshooting decision sequence">
  <title>Troubleshooting decision sequence</title>
  <desc>Check association, entries, PacketDropCountNoPolicy, then rule order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="diagram-arrow-head"/>
    </marker>
  </defs>
  <rect x="280" y="20" width="200" height="44" rx="10" class="diagram-accent"/>
  <text x="380.0" y="42.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Traffic dropped?</text>
  <line x1="380" y1="64" x2="380" y2="84" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="260" y="84" width="240" height="48" rx="10" class="diagram-node"/>
  <text x="380.0" y="108.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Policy table associated?</text>
  <polyline points="260,108 120,108" fill="none" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="154.0" y="97" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="190" y="108" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">no</text>
  <rect x="20" y="86" width="100" height="44" rx="10" class="diagram-accent"/>
  <text x="70.0" y="108.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Associate</text>
  <line x1="380" y1="132" x2="380" y2="160" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="260" y="160" width="240" height="48" rx="10" class="diagram-node"/>
  <text x="380.0" y="184.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Entries present?</text>
  <polyline points="260,184 120,184" fill="none" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="154.0" y="173" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="190" y="184" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">empty</text>
  <rect x="20" y="162" width="100" height="44" rx="10" class="diagram-accent"/>
  <text x="70.0" y="184.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Add rules</text>
  <line x1="380" y1="208" x2="380" y2="236" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="240" y="236" width="280" height="48" rx="10" class="diagram-node"/>
  <text x="380.0" y="260.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">PacketDropCountNoPolicy?</text>
  <polyline points="240,260 120,260" fill="none" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="144.0" y="249" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="180" y="260" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">elevated</text>
  <rect x="20" y="238" width="100" height="44" rx="10" class="diagram-accent"/>
  <text x="70.0" y="252.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Catch-all</text>
  <text x="70.0" y="267.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">or rules</text>
  <line x1="380" y1="284" x2="380" y2="312" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="260" y="312" width="240" height="48" rx="10" class="diagram-node"/>
  <text x="380.0" y="336.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Rule order / shadowing</text>
  <line x1="380" y1="360" x2="380" y2="384" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="280" y="384" width="200" height="40" rx="10" class="diagram-accent"/>
  <text x="380.0" y="404.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Reorder by specificity</text>
</svg>
