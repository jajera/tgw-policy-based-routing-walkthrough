<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="100%" role="img" aria-label="PBR mental model: policy table then route table">
  <title>PBR mental model: policy table then route table</title>
  <desc>Packet arrives on a policy-associated attachment; the policy table selects a route table; that table does destination-CIDR lookup to a next hop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="diagram-arrow-head"/>
    </marker>
  </defs>
  <rect x="24" y="28" width="190" height="48" rx="10" class="diagram-accent"/>
  <text x="119.0" y="52.0" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Packet in on attachment</text>
  <line x1="119" y1="76" x2="119" y2="118" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="24" y="118" width="190" height="64" rx="10" class="diagram-node"/>
  <text x="119.0" y="142.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Policy table</text>
  <text x="119.0" y="157.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">(L3/L4 match)</text>
  <line x1="214" y1="150" x2="314" y2="150" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="228.0" y="139.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="264.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">selects</text>
  <rect x="314" y="118" width="190" height="64" rx="10" class="diagram-node"/>
  <text x="409.0" y="142.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Route table</text>
  <text x="409.0" y="157.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">(destination IP)</text>
  <line x1="504" y1="150" x2="620" y2="150" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="524.6" y="139.0" width="74.8" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="562.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">CIDR lookup</text>
  <rect x="620" y="118" width="190" height="64" rx="10" class="diagram-accent"/>
  <text x="715.0" y="142.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Attachment /</text>
  <text x="715.0" y="157.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">next hop</text>
</svg>
