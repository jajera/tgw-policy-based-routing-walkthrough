<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" role="img" aria-label="Policy table rule evaluation order">
  <title>Policy table rule evaluation order</title>
  <desc>1 system-managed, 2 customer-managed ascending (lab: 100 then 200), 3 implicit deny if nothing matches.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="diagram-arrow-head"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="diagram-label" font-weight="600" font-size="13">Evaluation order (top → bottom)</text>
  <circle cx="36" cy="70" r="14" class="diagram-accent"/>
  <text x="36" y="70" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="13">1</text>
  <rect x="64" y="46" width="280" height="48" rx="10" class="diagram-accent"/>
  <text x="204.0" y="62.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">System-managed entries</text>
  <text x="204.0" y="77.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">rule number * · match → stop</text>
  <line x1="204" y1="94" x2="204" y2="126" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="168.0" y="99.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="204.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">no match</text>
  <circle cx="36" cy="160" r="14" class="diagram-accent"/>
  <text x="36" y="160" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="13">2</text>
  <rect x="64" y="126" width="560" height="168" rx="12" class="diagram-cluster"/>
  <text x="78" y="148" class="diagram-label" font-weight="600" font-size="12">Customer-managed — ascending rule # (lowest first)</text>
  <rect x="84" y="158" width="170" height="48" rx="10" class="diagram-node"/>
  <text x="169.0" y="174.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">2a · Rule 100</text>
  <text x="169.0" y="189.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">TCP/443 → Steer</text>
  <line x1="254" y1="182" x2="300" y2="182" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="300" y="158" width="150" height="48" rx="10" class="diagram-accent"/>
  <text x="375.0" y="174.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">→ Steer RT</text>
  <text x="375.0" y="189.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">match · stop</text>
  <line x1="169" y1="206" x2="169" y2="230" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="133.0" y="207.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="169.0" y="218.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">no match</text>
  <rect x="84" y="230" width="170" height="48" rx="10" class="diagram-node"/>
  <text x="169.0" y="246.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">2b · Rule 200</text>
  <text x="169.0" y="261.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">* → Direct</text>
  <line x1="254" y1="254" x2="300" y2="254" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="300" y="230" width="150" height="48" rx="10" class="diagram-accent"/>
  <text x="375.0" y="246.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">→ Direct RT</text>
  <text x="375.0" y="261.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">match · stop</text>
  <line x1="204" y1="294" x2="204" y2="326" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="168.0" y="299.0" width="72" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="204.0" y="310.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">no match</text>
  <circle cx="36" cy="366" r="14" class="diagram-accent"/>
  <text x="36" y="366" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="13">3</text>
  <rect x="64" y="342" width="280" height="48" rx="10" class="diagram-accent"/>
  <text x="204.0" y="358.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Implicit deny</text>
  <text x="204.0" y="373.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">no match anywhere → drop</text>
  <text x="360" y="418" text-anchor="middle" class="diagram-label" font-size="12">First matching entry wins; evaluation stops.</text>
</svg>
