<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" role="img" aria-label="Destination-based vs attribute-based forwarding">
  <title>Destination-based vs attribute-based forwarding</title>
  <desc>Classic route tables forward by destination IP only so equal destinations share a path. A policy table matches L3/L4 attributes first, selects a route table, then destination lookup runs — so :443 and :80 can diverge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="diagram-arrow-head"/>
    </marker>
  </defs>
  <rect x="20" y="16" width="760" height="118" rx="12" class="diagram-cluster"/>
  <text x="34" y="38" class="diagram-label" font-weight="600" font-size="12">Destination-based (route table)</text>
  <rect x="40" y="48" width="150" height="56" rx="10" class="diagram-accent"/>
  <text x="115.0" y="68.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Packet in</text>
  <text x="115.0" y="83.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">on attachment</text>
  <line x1="190" y1="76" x2="250" y2="76" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="250" y="48" width="180" height="56" rx="10" class="diagram-node"/>
  <text x="340.0" y="68.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Route table</text>
  <text x="340.0" y="83.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">dest IP only</text>
  <line x1="430" y1="76" x2="520" y2="76" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="437.6" y="65.0" width="74.8" height="20" rx="4" class="diagram-edge-bg"/>
  <text x="475.0" y="76.0" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">CIDR lookup</text>
  <rect x="520" y="48" width="180" height="56" rx="10" class="diagram-accent"/>
  <text x="610.0" y="68.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Attachment /</text>
  <text x="610.0" y="83.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">next hop</text>
  <rect x="40" y="112" width="300" height="18" rx="4" class="diagram-edge-bg"/>
  <text x="190" y="121" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">:80 and :443 to same IP → same path</text>
  <rect x="20" y="154" width="760" height="196" rx="12" class="diagram-cluster"/>
  <text x="34" y="176" class="diagram-label" font-weight="600" font-size="12">Attribute-based (policy table)</text>
  <rect x="40" y="190" width="150" height="56" rx="10" class="diagram-accent"/>
  <text x="115.0" y="210.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Packet in</text>
  <text x="115.0" y="225.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">on attachment</text>
  <line x1="190" y1="218" x2="250" y2="218" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="250" y="190" width="150" height="56" rx="10" class="diagram-node"/>
  <text x="325.0" y="210.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Policy table</text>
  <text x="325.0" y="225.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">L3/L4 match</text>
  <polyline points="400,218 430,218 430,196 460,196" fill="none" class="diagram-line" marker-end="url(#arrow)"/>
  <polyline points="430,218 430,250 460,250" fill="none" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="460" y="168" width="140" height="48" rx="10" class="diagram-accent"/>
  <text x="530.0" y="184.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Steer RT</text>
  <text x="530.0" y="199.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">TCP/443</text>
  <rect x="460" y="230" width="140" height="48" rx="10" class="diagram-node"/>
  <text x="530.0" y="246.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Direct RT</text>
  <text x="530.0" y="261.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">:80 / ICMP</text>
  <line x1="600" y1="192" x2="650" y2="192" class="diagram-line" marker-end="url(#arrow)"/>
  <line x1="600" y1="254" x2="650" y2="254" class="diagram-line" marker-end="url(#arrow)"/>
  <rect x="650" y="168" width="110" height="48" rx="10" class="diagram-accent"/>
  <text x="705.0" y="184.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Spoke B</text>
  <text x="705.0" y="199.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">via Hub</text>
  <rect x="650" y="230" width="110" height="48" rx="10" class="diagram-node"/>
  <text x="705.0" y="246.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-weight="600" font-size="12">Spoke B</text>
  <text x="705.0" y="261.5" text-anchor="middle" dominant-baseline="middle" class="diagram-text" font-size="11">direct</text>
  <rect x="40" y="308" width="420" height="18" rx="4" class="diagram-edge-bg"/>
  <text x="250" y="317" text-anchor="middle" dominant-baseline="middle" class="diagram-edge-text" font-size="11">First match selects a route table; then dest-CIDR lookup</text>
</svg>
